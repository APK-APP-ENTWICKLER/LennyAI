<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LennyAI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #303030;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #f5f5f5;
      color: #111111;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: bold;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
    }

    header p {
      font-size: 13px;
      color: #999999;
      margin: 4px 0 0;
    }

    #chat {
      flex: 1;
      padding: 22px 16px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      background: #292929;
      border-bottom-left-radius: 5px;
    }

    .user .bubble {
      background: #f5f5f5;
      color: #111111;
      border-bottom-right-radius: 5px;
    }

    .welcome {
      text-align: center;
      color: #999999;
      padding: 70px 15px 35px;
    }

    .welcome h2 {
      color: #f5f5f5;
      font-size: 27px;
      margin-bottom: 10px;
    }

    .welcome p {
      line-height: 1.5;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px 16px 20px;
      border-top: 1px solid #303030;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px 17px;
      border: 1px solid #444444;
      border-radius: 25px;
      background: #222222;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #888888;
    }

    button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #f5f5f5;
      color: #111111;
      font-size: 20px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    .clear {
      background: transparent;
      color: #aaaaaa;
      border: 1px solid #444444;
      width: auto;
      height: auto;
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">L</div>
      <div>
        <h1>LennyAI</h1>
        <p>Dein persönlicher KI-Assistent</p>
      </div>
      <div style="margin-left:auto">
        <button class="clear" id="clearBtn">Neu</button>
      </div>
    </header>

    <section id="chat">
      <div class="welcome" id="welcome">
        <h2>Wie kann ich helfen?</h2>
        <p>Schreibe deine erste Nachricht an LennyAI.</p>
      </div>
    </section>

    <form id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Nachricht schreiben ..."
        autocomplete="off"
      >
      <button type="submit" aria-label="Nachricht senden">↑</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const clearBtn = document.getElementById("clearBtn");

    function addMessage(text, sender) {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      const message = document.createElement("div");
      message.className = "message " + sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(function() {
        addMessage(
          "Das ist eine Demo-Antwort von LennyAI. Die echte KI wird im nächsten Schritt angeschlossen.",
          "assistant"
        );
      }, 500);
    });

    clearBtn.addEventListener("click", function() {
      chat.innerHTML = `
        <div class="welcome" id="welcome">
          <h2>Wie kann ich helfen?</h2>
          <p>Schreibe deine erste Nachricht an LennyAI.</p>
        </div>
      `;
    });
  </script>
</body>
</html>
